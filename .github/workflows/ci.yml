name: CI

# Un composant Python (un projet uv) livré en image Docker : un job qualité + tests + audit, un scan de secrets, un contrôle
# du titre de la PR, un job image (build, démarrage durci, scan Trivy), et `ci-ok`, le SEUL check à rendre obligatoire dans la
# protection de branche (« skipped » vaut « vert »).
# Les jobs appellent les tâches poe du projet, jamais un outil en direct : la CI rejoue ce que font les hooks Git.
# Toutes les actions sont épinglées par SHA complet (la version est en commentaire) ; les SHA de Docker et Trivy sont ceux
# de BaseCamp.

on:
  pull_request:
    branches: [main]
    # `edited` : un titre de PR corrigé relance le contrôle du titre.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # Installation figée sur uv.lock, sans compiler de paquet (roues uniquement), avec le Python du projet.
  UV_FROZEN: "1"
  UV_NO_BUILD: "1"
  UV_PYTHON: "3.12"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Installation figée
        run: uv sync
      - name: requirements.txt (utilisé par le Dockerfile) à jour avec uv.lock
        run: |
          uv run poe requirements
          git diff --exit-code requirements.txt
      - name: Qualité (lint, formatage, types)
        run: uv run poe quality
      - name: Tests et couverture (seuil 80 %)
        run: uv run poe test
      - name: Sécurité (CVE des dépendances)
        run: uv run poe security

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (commits apportés par la PR ou le push)
        # Ne scanne que ce que l'événement apporte, pas les autres branches : un faux jeton poussé sur une branche
        # de travail ne doit pas faire échouer les autres PR. Même version et même configuration que le hook pre-push.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_AFTER" ] && [ "${PUSH_BEFORE#0000000}" = "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            # Nouvelle branche ou historique réécrit : tout ce que HEAD ajoute à main.
            range="origin/main..HEAD"
          fi
          echo "gitleaks sur $range"
          ./gitleaks git --redact -v --log-opts="$range" .

  pr-title:
    name: pr-title
    # Le titre d'une PR fusionnée en squash devient le message du commit sur main : même règle que le hook commit-msg.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Le titre respecte Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/titre.txt"
          python3 scripts/hooks/check_commit_msg.py "$RUNNER_TEMP/titre.txt"

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build de l'image (cache GitHub Actions)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ml-detector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrage avec les réglages de durcissement du compose, jusqu'à « healthy »
        # Mêmes options que l'extrait de compose : système de fichiers en lecture seule, aucune capacité, no-new-privileges.
        # Source « simule » : pas de Loki ni de remédiation nécessaires. Aucun port publié, comme en production.
        run: |
          docker run -d --name ml-detector --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -e DETECTOR_SOURCE=simule ml-detector:ci
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' ml-detector)
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          echo "état du conteneur : $status"
          [ "$status" = "healthy" ]
      - name: Logs du conteneur
        if: failure()
        run: docker logs ml-detector --tail 100
      - name: Nettoyage
        if: always()
        run: docker rm -f ml-detector
      - name: Scan Trivy bloquant (HIGH, CRITICAL corrigeables, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ml-detector:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          # Une faille sans correctif disponible ne bloque pas : on ne peut rien y faire.
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

  ci-ok:
    name: ci-ok
    if: always()
    needs: [python, secrets-scan, pr-title, docker]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tous les jobs bloquants sont verts
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e '[.[].result] | all(. == "success" or . == "skipped")'
