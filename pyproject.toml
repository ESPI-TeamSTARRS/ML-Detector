[project]
name = "ml-detector"
version = "0.1.0"
description = "Détecteur d'anomalies Resilience-Alpha (pilier IA/ML)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "joblib==1.4.2",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "prometheus-client==0.21.1",
    "python-dotenv==1.1.0",
    "requests==2.32.3",
    "scikit-learn==1.6.1",
    "uvicorn[standard]==0.34.2",
]

# Outillage de dev uniquement : pas de package à construire.
# L'image Docker continue d'installer requirements.txt.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
]

[tool.poe.tasks.serve]
help = "Lance le serveur (source lue dans .env), rechargement auto"
cmd = "uvicorn app.presentation.api.main:app --reload --port 8000"

[tool.poe.tasks.serve-sim]
help = "Lance le serveur en mode simulé (DETECTOR_SOURCE=simule, sans Loki)"
cmd = "uvicorn app.presentation.api.main:app --reload --port 8000"
env = { DETECTOR_SOURCE = "simule" }

[tool.poe.tasks.test]
help = "Lance les tests"
cmd = "pytest"
